name: Verifica Progetto Gas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: gastest
          POSTGRES_USER: gas
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gas -d gastest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test calcolo, API e PDF su H2
        run: mvn -B verify
      - name: Test API su PostgreSQL
        run: mvn -B test -Dtest=GasApiTest -Dspring.datasource.url=jdbc:postgresql://localhost:5432/gastest -Dspring.datasource.username=gas -Dspring.datasource.password=ci-test-only
      - uses: actions/upload-artifact@v4
        with:
          name: gas-backend
          path: backend/target/progetto-gas-0.1.0.jar
  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: gas-backend
          path: backend/target
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-browser-results
          path: frontend/test-results
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build e avvio Docker 8090
        run: |
          printf 'DB_PASSWORD=ci-compose-test-only\n' > .env
          docker compose up --build -d --wait
      - name: Verifica quattro scenari e PDF
        run: python3 scripts/verifica-compose.py
      - name: Verifica persistenza dopo ricreazione
        run: |
          docker compose up -d --force-recreate --wait
          python3 scripts/verifica-compose.py --persistenza
      - name: Log in caso di errore
        if: failure()
        run: docker compose logs --no-color
      - name: Rimuovi stack temporaneo CI
        if: always()
        run: docker compose down -v
