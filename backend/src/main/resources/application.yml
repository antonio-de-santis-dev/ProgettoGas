spring:
  application:
    name: progetto-gas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/progettogas}
    username: ${DB_USER:gas}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
